[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-measure-reconstruction"
version = "0.1.0"
description = "Reproducible numerical experiments for Reconstructing risk preferences from data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Anastasis Kratsios"},
  {name = "Silvana M. Pesenti"},
  {name = "Philipp Zimmermann"},
]
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "pandas>=2.2,<3",
  "clarabel>=0.11,<0.12", "mpmath>=1.3,<2", "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1.2,<2", "ruff>=0.11,<0.12"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<7"]

[project.scripts]
risk-reconstruct = "risk_measure_reconstruction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: full-law Heston quadrature or experiment integration"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"] # Set thread defaults before importing NumPy.

